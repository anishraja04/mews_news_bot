name: Mews News Auto Poster

on:
  schedule:
    - cron: '*/5 * * * *' # हर 5 मिनट में चेक करेगा
  workflow_dispatch:
  repository_dispatch:
    types: [run-bot] # cron-job.org trigger

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          cd mews_news_bot
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4 playwright "googletrans==4.0.0-rc1" edge-tts
          playwright install chromium
          
      - name: Run FB Bot
        run: |
          cd mews_news_bot
          python bot.py
          
      - name: Commit and Push Posted News & Bot State
        run: |
          git config --global user.name "Mews News Bot"
          git config --global user.email "bot@mewsnews.local"
          git add mews_news_bot/posted_news.txt mews_news_bot/bot_state.json
          git commit -m "Auto-updated posted news record and bot state" || echo "No new posts to commit"
          git push origin main || git push origin master
