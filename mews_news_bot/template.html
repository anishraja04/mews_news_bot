<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Mukta:wght@600;800&family=Poppins:wght@900&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            width: 800px;
            height: 1000px;
            font-family: 'Mukta', sans-serif;
            background-color: #000;
            position: relative;
            overflow: hidden;
        }

        /* The actual news image (Celebrity/Politician etc.) */
        .news-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Black Gradient overlay to make yellow text pop out */
        .gradient-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65%;
            background: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.85) 30%, rgba(0,0,0,0.4) 70%, rgba(0,0,0,0) 100%);
            z-index: 2;
        }

        /* Small modern logo */
        .logo-container {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 3;
            background: white;
            padding: 8px 15px;
            border-radius: 8px;
            border-left: 6px solid #cc0000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        
        .logo-text {
            font-family: 'Poppins', sans-serif;
            font-weight: 900;
            font-size: 26px;
            line-height: 1;
            letter-spacing: -1px;
        }
        .logo-text .mews { color: #0b1c2c; }
        .logo-text .news { color: #cc0000; }

        /* Headline text container */
        .text-container {
            position: absolute;
            bottom: 60px;
            left: 40px;
            right: 40px;
            z-index: 3;
        }

        /* Big Bold Hindi Headline */
        .headline {
            font-size: 55px;
            font-weight: 800;
            color: #ffd700; /* Bright Yellow */
            line-height: 1.25;
            text-shadow: 3px 3px 15px rgba(0,0,0,1);
        }

    </style>
</head>
<body>

    <img src="यहाँ_इमेज_आएगी" class="news-image">
    
    <div class="gradient-overlay"></div>

    <div class="logo-container">
        <div class="logo-text">
            <span class="mews">MEWS</span><span class="news">NEWS</span>
        </div>
    </div>

    <div class="text-container">
        <div class="headline">यहाँ न्यूज़ की बड़ी हेडलाइन आएगी</div>
    </div>

</body>
</html>
