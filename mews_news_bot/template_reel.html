<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Mews News Reel Template</title>
    <link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Hindi&family=Poppins:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 720px;
            height: 1280px;
            background-color: #0b0f19;
            font-family: 'Tiro Devanagari Hindi', serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Full Background Image with Blur & Dark Overlay */
        .bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('यहाँ_इमेज_आएगी');
            background-size: cover;
            background-position: center;
            filter: blur(25px) brightness(0.25);
            transform: scale(1.1);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 35px 50px 35px;
        }

        /* Top Header */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-badge {
            background: #e60000;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            font-weight: 900;
            font-size: 26px;
            padding: 6px 18px;
            border-radius: 8px;
            letter-spacing: 1.5px;
            box-shadow: 0 4px 15px rgba(230, 0, 0, 0.5);
        }

        .channel-name {
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 24px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .live-tag {
            background: rgba(255, 255, 255, 0.15);
            color: #ffcc00;
            border: 1px solid #ffcc00;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 15px;
            padding: 6px 14px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background: #ffcc00;
            border-radius: 50%;
            box-shadow: 0 0 8px #ffcc00;
        }

        /* Main Visual Media Card */
        .media-container {
            width: 100%;
            height: 520px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.12);
            position: relative;
        }

        .media-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Headline & Info Card */
        .content-card {
            background: linear-gradient(180deg, rgba(17, 24, 39, 0.85) 0%, rgba(10, 15, 26, 0.98) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 22px;
            padding: 26px 28px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .headline {
            color: #ffffff;
            font-size: 32px;
            line-height: 1.35;
            font-weight: 700;
            margin-bottom: 16px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.6);
        }

        .headline span {
            color: #ffd000;
        }

        .summary-box {
            color: #e2e8f0;
            font-size: 21px;
            line-height: 1.45;
            border-left: 4px solid #e60000;
            padding-left: 14px;
        }

        /* Footer */
        .footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            color: #94a3b8;
            font-size: 17px;
            font-family: 'Poppins', sans-serif;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .follow-tag {
            color: #ff3b3b;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="bg-layer"></div>

    <div class="container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="logo-box">
                <div class="logo-badge">MEWS</div>
                <div class="channel-name">NEWS</div>
            </div>
            <div class="live-tag">
                <div class="live-dot"></div> REEL UPDATE
            </div>
        </div>

        <!-- Main Image -->
        <div class="media-container">
            <img src="यहाँ_इमेज_आएगी" alt="News Image">
        </div>

        <!-- Headline & Summary -->
        <div class="content-card">
            <h1 class="headline"><span>बड़ी खबर:</span> यहाँ न्यूज़ की बड़ी हेडलाइन आएगी</h1>
            <div class="summary-box">
                यहाँ_शॉर्ट_समरी_आएगी
            </div>
        </div>

        <!-- Footer -->
        <div class="footer-bar">
            <span>fb.com/hindinewsmews</span>
            <span class="follow-tag">▶ फॉलो करें ताज़ा खबरों के लिए</span>
        </div>
    </div>
</body>
</html>
